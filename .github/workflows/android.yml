# 云端编译安卓 APK。
#
# 为什么全部放在 CI：安卓交叉编译需要 JDK + Android SDK + NDK + 4 个 Rust 目标，
# 本地配齐要 3-5 GB。公开仓库的 GitHub Actions 分钟数免费，
# 因此本地只需要 Node 和 Rust 就能开发，重活交给这里。
#
# 产出两种包，都会附到 Release 上：
#
# | 包 | 签名 | 用途 |
# |---|---|---|
# | release | 固定密钥（GitHub Secrets） | **日常安装用这个**，小、快、可覆盖升级 |
# | debug | 每次构建的临时密钥 | 只用于排查问题，很大（保留调试符号） |
#
# ⚠️ debug 包不要用来日常安装：模板里 `jniLibs.keepDebugSymbols` 会为
# 每个 ABI 保留未剥离符号的 .so，单个就有约 160 MB，四个 ABI 合计约 612 MB，
# 解压后接近 620 MB —— 手机解析不了会报「安装包已损坏」。

name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧构建自动取消，省 CI 时间。
#
# 用 head_sha 而非 ref 作为 key：连续两次推送时，各自的 SHA 不同，
# 因此后一次不会取消前一次的安卓构建。
# （早期用 ref 做 key，结果一次推送把上一次正在跑的安卓构建取消了，
#  白等一场。安卓交叉编译要 8-10 分钟，被取消的代价很高。）
concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 快速校验：类型检查 + Rust 单测。失败就不必浪费 10 分钟去编 APK。
  # ---------------------------------------------------------------------------
  check:
    name: 类型检查与单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Frontend build
        run: pnpm build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 为什么需要这一步：
      # 在 Linux 上 `tauri` 会拉入 `wry` / `tao`（使用系统 WebKit 的桌面后端），
      # 它们依赖 GTK / GLib 的 C 库。本项目的目标虽然是安卓，
      # 但宿主机上跑 `cargo test` 仍会编译这些桌面依赖。
      #
      # 注意 `libwebkit2gtk-4.1-dev` 只提供可执行文件不提供 .pc 文件，
      # 因此必须**同时**装 `libglib2.0-dev` 与 `libgtk-3-dev`，
      # 否则 glib-sys 会在 pkg-config 阶段失败：
      #   "Package glib-2.0 was not found in the pkg-config search path"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            file

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          prefix-key: v1-rust
          cache-on-failure: true

      # Rust 单测覆盖 SM4 解密、坐标转换偏移量、ETA 区间、规划算法、
      # 收班判定（含跨零点）、脏数据容错等最易出错的部分。
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib --verbose

  # ---------------------------------------------------------------------------
  # 安卓构建：release（日常用）+ debug（排查用）
  # ---------------------------------------------------------------------------
  android:
    name: 安卓 APK
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          prefix-key: v1-rust-android
          cache-on-failure: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # NDK 必须用 **发布名**（r29），不能写数字版本——
      # setup-ndk 会拼 https://dl.google.com/.../android-ndk-${version}-linux.zip，
      # 传 29.0.13846066 会 404。
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      # tauri-action **不会**自动生成 Android 工程。
      # `tauri android build` 要求 `src-tauri/gen/android` 已存在。
      # 顺序很重要：必须放在 SDK / NDK / JDK 都就位之后。
      - name: Init Android project
        run: pnpm tauri android init --ci

      # 模板里没有 signingConfigs，不注入就只能产出 *-unsigned.apk，
      # 而那个包装不上（INSTALL_PARSE_FAILED_NO_CERTIFICATES）。
      # 详见 scripts/patch-android-signing.mjs 头部注释。
      #
      # ⚠️ 这里**不能**用 `if: secrets.X != ''`：GitHub Actions 的
      # step 级 if 不支持 secrets 上下文（只有 job 级支持），
      # 写了会导致整个工作流在解析阶段就失败、一个 job 都不跑。
      # 因此改成在脚本内部判空，并通过 step output 把结果传给后续步骤。
      - name: Patch Android signing config
        id: signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEY_BASE64:-}" ]; then
            echo "::warning::未配置 ANDROID_KEY_BASE64，跳过签名。只会产出未签名的 release 包（无法安装）。"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/patch-android-signing.mjs
          cd src-tauri/gen/android

          # base64 里可能夹带换行或空格，先清掉再解码
          printf '%s' "$ANDROID_KEY_BASE64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/whbus-release.jks"
          test -s "$RUNNER_TEMP/whbus-release.jks" || { echo "::error::keystore 解码后为空"; exit 1; }

          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/whbus-release.jks"
          } > keystore.properties

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "✓ 签名配置就绪"

      # ---------------- release：日常安装用这个 ----------------
      #
      # `--split-per-abi` 让每个 ABI 出独立的包，体积远小于 universal。
      # arm64-v8a 覆盖近十年的手机，arm 覆盖更老的 32 位机型。
      - name: Build signed release APKs
        if: steps.signing.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          mobile: android
          args: --apk --split-per-abi

      # ---------------- debug：只用于排查 ----------------
      #
      # 不含签名配置也能出包：AGP 会自动用 runner 上的 debug.keystore 签名。
      # 但**不要用它日常安装**（体积约 160MB/ABI，见本文件头部说明）。
      - name: Build debug APK
        uses: tauri-apps/tauri-action@v1
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          mobile: android
          args: --apk --debug --target aarch64

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          base=src-tauri/gen/android/app/build/outputs/apk

          echo "--- 构建产生的全部 APK ---"
          find "$base" -name '*.apk' -printf '%s\t%p\n' | sort -rn |
            awk -F'\t' '{printf "%9.2f MB  %s\n", $1/1048576, $2}'

          # release：只收已签名的。未签名包名带 -unsigned 后缀，装了会报
          # INSTALL_PARSE_FAILED_NO_CERTIFICATES，所以用 -name 'app-*-release.apk'
          # 精确匹配（'*-unsigned.apk' 不满足该模式）。
          n_rel=$(find "$base" -name 'app-*-release.apk' | wc -l)
          if [ "$n_rel" -gt 0 ]; then
            find "$base" -name 'app-*-release.apk' -exec cp -t dist-apk/ {} +
            echo "✓ 收集到 $n_rel 个 release 包"
          else
            echo "::warning::没有已签名的 release 包（签名是否就绪？）"
          fi

          # debug 兜底：保证至少有一个可下载的产物
          if [ "$(find "$base" -name 'app-universal-debug.apk' | wc -l)" -gt 0 ]; then
            find "$base" -name 'app-universal-debug.apk' -exec cp -t dist-apk/ {} +
            echo "✓ 已附带 debug 包（仅排查用）"
          fi

          echo "--- 最终收纳 ---"
          ls -la dist-apk/
          test -n "$(ls -A dist-apk)" || { echo "::error::没有收到任何 APK"; exit 1; }

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v7
        with:
          name: whbus-apk
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # 附到 Release：artifact 下载得到的是 zip，且上传后体积受限；
      # 直接给 APK 文件更省事，也不会再出现"解压后才发现包有问题"的误会。
      #
      # 用固定的 latest 标签滚动更新，于是有一个稳定链接可分享：
      #   https://github.com/CoconutHR/whbus/releases/latest
      - name: Publish to Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            TITLE="whbus ${{ github.ref_name }}"
          else
            TAG="latest"
            TITLE="whbus 最新构建（滚动更新）"
          fi

          # 已存在则先删掉同名 release，避免资产重名报错。
          # 不加 --cleanup-tag：那会顺手删掉 git tag。
          gh release delete "$TAG" --yes 2>/dev/null || true

          NOTES="$(cat <<EOF
          自动构建于 $(date -u '+%Y-%m-%d %H:%M UTC')
          提交 \`${GITHUB_SHA:0:7}\`

          ### 下载哪个

          | 文件 | 说明 |
          |---|---|
          | \`app-arm64-v8a-release.apk\` | **绝大多数手机装这个** |
          | \`app-armeabi-v7a-release.apk\` | 较老的 32 位机型 |
          | \`app-universal-debug.apk\` | 仅用于排查问题，体积很大（含未剥离符号，约 620 MB） |

          ### 安装

          下载 APK 后直接点击安装。首次安装需在系统设置里允许「安装未知来源应用」。

          release 包使用固定密钥签名，因此**可以直接覆盖升级**，不需要卸载重装。
          debug 包每次构建用的都是临时密钥，装新的之前必须先卸载旧的。

          ### 注意

          - 上游公交接口在收班时段（约 21:00 之后）会返回空数据，这是服务端行为，不是 App 故障。
          - 按地址搜索地点需要先在「我的 → 高德地图」填入你自己的高德 Key（免费申请，
            类型选「Web 服务」）。公交接口只认站名，不认小区名与写字楼名。
          EOF
          )"

          if [ "$TAG" = "latest" ]; then
            gh release create "$TAG" dist-apk/*.apk --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" dist-apk/*.apk --title "$TITLE" --notes "$NOTES" --latest
          fi

      - name: Summarize
        run: |
          {
            echo "## whbus 安卓包已就绪"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            ls -la dist-apk/*.apk 2>/dev/null | awk '{printf "| `%s` | %.1f MB |\n", $NF, $5/1048576}' | sed 's#dist-apk/##'
            echo ""
            echo "Release: https://github.com/${{ github.repository }}/releases/latest"
          } >> "$GITHUB_STEP_SUMMARY"
