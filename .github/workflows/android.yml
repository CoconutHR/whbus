# 云端编译安卓 APK。
#
# 为什么全部放在 CI：安卓交叉编译需要 JDK + Android SDK + NDK + 4 个 Rust 目标，
# 本地配齐要 3-5 GB。公开仓库的 GitHub Actions 分钟数免费，
# 因此本地只需要 Node 和 Rust 就能开发，重活交给这里。
#
# 产物是 **debug APK，无需任何签名密钥**：AGP 会自动用 runner 上的
# debug.keystore 签名，可直接侧载安装。（release APK 才需要签名密钥，
# 届时再加 ANDROID_KEY_* 三个 secret。）

name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧构建自动取消，省 CI 时间。
#
# 用 head_sha 而非 ref 作为 key：连续两次推送时，各自的 SHA 不同，
# 因此后一次不会取消前一次的安卓构建。
# （早期用 ref 做 key，结果一次推送把上一次正在跑的安卓构建取消了，
#  白等一场。安卓交叉编译要 8-10 分钟，被取消的代价很高。）
concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 快速校验：类型检查 + Rust 单测。失败就不必浪费 10 分钟去编 APK。
  # ---------------------------------------------------------------------------
  check:
    name: 类型检查与单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Frontend build
        run: pnpm build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 为什么需要这一步：
      # 在 Linux 上 `tauri` 会拉入 `wry` / `tao`（使用系统 WebKit 的桌面后端），
      # 它们依赖 GTK / GLib 的 C 库。本项目的目标虽然是安卓，
      # 但宿主机上跑 `cargo test` 仍会编译这些桌面依赖。
      #
      # 注意 `libwebkit2gtk-4.1-dev` 只提供可执行文件不提供 .pc 文件，
      # 因此必须**同时**装 `libglib2.0-dev` 与 `libgtk-3-dev`，
      # 否则 glib-sys 会在 pkg-config 阶段失败：
      #   "Package glib-2.0 was not found in the pkg-config search path"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            file

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          # 缓存损坏会导致 "could not compile wry"，这是已知偶发问题；
          # 换 key 前缀即可重置缓存。
          prefix-key: v1-rust
          cache-on-failure: true

      # Rust 单测覆盖 SM4 解密、坐标转换偏移量、ETA 区间、收班判定等
      # 关键逻辑——这些是本项目最容易出错、也最该被守住的部分。
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib --verbose

  # ---------------------------------------------------------------------------
  # 安卓构建
  # ---------------------------------------------------------------------------
  android:
    name: 安卓 debug APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          prefix-key: v1-rust-android
          cache-on-failure: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # NDK 必须用 **发布名**（r29），不能写数字版本——
      # setup-ndk 会拼 https://dl.google.com/.../android-ndk-${version}-linux.zip，
      # 传 29.0.13846066 会 404。
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      # tauri-action **不会**自动生成 Android 工程。
      # `tauri android build` 要求 `src-tauri/gen/android` 已存在，
      # 否则报 "Android Studio project directory ... doesn't exist.
      # Please run `tauri android init` and try again."
      #
      # 这里选择在 CI 内初始化而不是把生成物提交进仓库：
      # 官方 .gitignore 默认忽略 gen/，且生成物体积大、diff 噪音高。
      # 初始化只需要几秒，代价可以接受。
      #
      # 顺序很重要：必须放在 SDK / NDK / JDK 都就位之后，
      # 因为 init 会检查安卓环境。
      - name: Init Android project
        run: pnpm tauri android init --ci

      # 只有单个 ABI 用于日常侧载，构建时间几乎减半。
      # 需要给其他架构出包时把 target 去掉即可。
      - name: Build Android APK (debug)
        uses: tauri-apps/tauri-action@v1
        env:
          # 必填：不设的话 Tauri 会扫描 $ANDROID_HOME/ndk 并取**排序最后一个**
          # （runner 上同时存在 27/29/30 三个 NDK，会选中 30）。
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          mobile: android
          args: --apk --debug --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: whbus-android-debug-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk
          if-no-files-found: error
          retention-days: 30
